<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가루다 교육과정 소개 — 매트·바레·체어·브릭·기구 커리큘럼 | GARUDA Academy Korea</title>
<meta name="description" content="가루다 메소드 지도자 교육과정별 소개, 일자별 커리큘럼, 분야별 핵심가치와 영상을 한곳에서 확인하세요. 매트, 소도구(바레·체어·브릭), 기구 과정.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#32383E;--ink-2:#3D444B;
  --paper:#F4F5F5;--card:#FFFFFF;--line:#D6D6D6;--line-2:#E6E7E7;
  --text:#222222;--soft:#62686D;--accent:#EC008C;--accent-tx:#C8007A;--accent-lt:#FF7AC2;
  --mat:#5C6E67;--app:#4A6072;--aux:#8E4A72;
  --r:2px;--pad:clamp(18px,5vw,60px);
}
header,.top,footer{--accent-tx:var(--accent-lt)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--text);font-family:'IBM Plex Sans KR',system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3{font-family:'Gowun Batang',serif;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.wrap{max-width:1140px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.eyebrow{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 25px;border-radius:var(--r);font:600 14.5px/1 'IBM Plex Sans KR',sans-serif;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:.18s;text-align:center}
.btn svg{width:17px;height:17px;flex:none}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{filter:brightness(.9)}
.btn-d{border-color:var(--ink);color:var(--ink)}.btn-d:hover{background:var(--ink);color:#fff}
.cta2{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:520px){.cta2{flex-direction:column}.cta2 .btn{width:100%}}

header{position:sticky;top:0;z-index:70;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.12)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Gowun Batang',serif;font-weight:700;font-size:16.5px;letter-spacing:.04em;text-decoration:none;color:#fff}
.logo span{color:var(--accent-tx)}
.hd nav{display:flex;gap:22px;font-size:13.5px}
.hd nav a{color:#fff;text-decoration:none;opacity:.75}.hd nav a:hover,.hd nav a[aria-current]{opacity:1}
@media(max-width:860px){.hd nav{display:none}}

/* 상단 소개 */
.top{background:var(--ink);color:#fff;padding:clamp(34px,5vw,60px) 0 clamp(28px,4vw,44px)}
.top .eyebrow{color:var(--accent-tx);margin-bottom:16px}
.top h1{font-size:clamp(26px,4.6vw,44px);color:#fff}
.top p{margin-top:14px;max-width:52ch;font-size:15px;font-weight:300;color:rgba(255,255,255,.78)}
.stats{display:flex;gap:clamp(22px,4vw,48px);margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);flex-wrap:wrap}
.stats dt{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.55)}
.stats dd{font:500 19px/1.3 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;margin-top:4px}

/* 과정 선택 (분야 → 과정) */
.picker{position:sticky;top:60px;z-index:60;background:var(--paper);border-bottom:1px solid var(--line)}
.cats{display:flex;gap:0;border-bottom:1px solid var(--line-2)}
.cat{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:15px 8px 12px;cursor:pointer;font:600 14px/1.2 'IBM Plex Sans KR',sans-serif;color:var(--soft);transition:.18s;text-align:center}
.cat small{display:block;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;opacity:.8}
.cat:hover{color:var(--text)}
.cat[aria-selected="true"]{color:var(--text);border-bottom-color:var(--c)}
.cat[aria-selected="true"] small{color:var(--c);opacity:1}
.courses{display:flex;gap:8px;padding:12px 0 13px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.courses::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13.5px/1 'IBM Plex Sans KR',sans-serif;padding:10px 15px;border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;color:var(--text);transition:.18s;white-space:nowrap;text-decoration:none}
.chip:hover{border-color:var(--c)}
.chip[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip.wait{color:var(--soft);background:transparent;border-style:dashed}
.chip.wait em{font-style:normal;font-size:11px;margin-left:6px;opacity:.8}
.chip.wait[aria-current="true"]{background:var(--soft);border-color:var(--soft);border-style:solid;color:#fff}
.catdesc{font-size:13px;color:var(--soft);padding-top:12px}

/* 과정 상세 */
#detail:focus{outline:none}
.detail{padding:clamp(30px,4.5vw,56px) 0 clamp(50px,7vw,90px)}
.dhead{display:grid;grid-template-columns:1fr auto;gap:18px 40px;align-items:end;padding-bottom:26px;border-bottom:1px solid var(--line)}
.dhead .eyebrow{color:var(--c);margin-bottom:12px}
.dhead h2{font-size:clamp(28px,4.4vw,44px)}
.dhead .kr{margin-top:6px;color:var(--soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(4,auto);gap:4px 26px}
.facts div{min-width:0}
.facts dt{font-size:11.5px;color:var(--soft);letter-spacing:.06em}
.facts dd{font:500 17px/1.35 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;margin-top:3px}
.facts .eq{grid-column:1/-1;margin-top:10px}
.facts .eq dd{font:400 13.5px/1.5 'IBM Plex Sans KR',sans-serif}
@media(max-width:820px){.dhead{grid-template-columns:1fr}.facts{grid-template-columns:repeat(3,auto);justify-content:start}}

.jump{display:flex;gap:6px 18px;flex-wrap:wrap;margin:18px 0 0;font-size:13px}
.jump a{color:var(--soft);text-decoration:none;border-bottom:1px solid transparent}
.jump a:hover{color:var(--text);border-bottom-color:var(--c)}
.jump a.sched{margin-left:auto;color:var(--accent-tx);font-weight:600}
@media(max-width:520px){.jump a.sched{margin-left:0}}

.block{padding-top:clamp(36px,5vw,58px);scroll-margin-top:190px}
.bh{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.bh .n{font:500 12px/1 'IBM Plex Mono',monospace;color:var(--c);letter-spacing:.14em}
.bh h3{font-size:clamp(20px,2.6vw,26px)}

/* 영상: 누를 때만 유튜브를 불러온다 (모바일 속도) */
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;max-width:880px}
.video button{all:unset;position:absolute;inset:0;cursor:pointer;display:block}
.video img{width:100%;height:100%;object-fit:cover;opacity:.82;transition:opacity .2s}
.video button:hover img{opacity:1}
.video .play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.video .play svg{width:26px;height:26px;margin-left:4px;fill:#fff}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.intro{max-width:70ch}
.intro .lead{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(18px,2.3vw,22px);line-height:1.5;margin-bottom:16px}
.intro p+p{margin-top:12px}
.intro p{font-size:15.5px;color:#383E43}

.notes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.notes span{font-size:12.5px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--soft)}
.curr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:10px}
.curr article{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 22px}
.curr .gn{font:500 11px/1 'IBM Plex Mono',monospace;color:var(--c);letter-spacing:.12em}
.curr h4{font-size:15.5px;font-weight:600;margin-top:9px;line-height:1.4}
.curr ul{list-style:none;margin-top:10px}
.curr li{font-size:13.5px;color:#454B50;padding:3px 0 3px 14px;position:relative;line-height:1.55}
.curr li::before{content:"";position:absolute;left:0;top:.8em;width:6px;height:1px;background:var(--c)}
.curr.desc li{padding-left:0}.curr.desc li::before{display:none}

.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.val{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;position:relative}
.val::before{content:"";position:absolute;left:-1px;top:-1px;right:-1px;height:3px;background:var(--c)}
.val .role{font:600 11.5px/1.3 'IBM Plex Sans KR',sans-serif;color:var(--c);letter-spacing:.04em}
.val .q{font-family:'Gowun Batang',serif;font-weight:700;font-size:17.5px;line-height:1.5;margin-top:10px}
.val .b{margin-top:12px}
.val .b p{font-size:14px;color:#454B50;line-height:1.7}
.val .b p+p{margin-top:9px}
.val .b b{display:block;color:var(--text);font-weight:600;font-size:13.5px}
.closing{margin-top:22px;max-width:70ch;padding-left:16px;border-left:2px solid var(--c);font-size:15px;color:#383E43}

/* 교육 현장 사진 (좌우 슬라이드) */
.gal{position:relative}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slides figure{flex:0 0 min(78%,560px);scroll-snap-align:start;aspect-ratio:4/3;background:var(--line-2);border-radius:var(--r);overflow:hidden}
.slides img{width:100%;height:100%;object-fit:cover;display:block}
.galnav{display:flex;align-items:center;gap:10px;margin-top:14px}
.galnav button{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--text)}
.galnav button:hover{border-color:var(--ink)}
.galnav button[disabled]{opacity:.35;cursor:default}
.galnav svg{width:16px;height:16px}
.galnav .cnt{font:500 13px/1 'IBM Plex Mono',monospace;color:var(--soft);margin-left:4px}

/* 상담 */
.ask{margin-top:clamp(40px,5.5vw,64px);background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(26px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap;--accent-tx:var(--accent-lt)}
.ask h3{color:#fff;font-size:clamp(19px,2.6vw,24px)}
.ask p{margin-top:8px;font-size:14px;color:rgba(255,255,255,.72);max-width:46ch}
.ask .btn-d{border-color:rgba(255,255,255,.42);color:#fff}.ask .btn-d:hover{background:rgba(255,255,255,.1);border-color:#fff;color:#fff}

.pn{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:13.5px}
.pn a{text-decoration:none;color:var(--soft);display:flex;flex-direction:column;gap:3px;max-width:48%}
.pn a:hover{color:var(--text)}
.pn a small{font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.pn a.next{text-align:right;margin-left:auto}

/* 준비중 */
.wait-box{margin-top:30px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:clamp(24px,4vw,40px);max-width:720px}
.wait-box h3{font-size:20px}
.wait-box p{margin-top:10px;color:var(--soft);font-size:14.5px}
.wait-box .cta2{margin-top:22px}

/* 모바일 하단 고정 상담 버튼 */
.dock{display:none}
@media(max-width:700px){
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(244,245,245,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .dock .btn{flex:1;padding:14px 10px}
  body{padding-bottom:74px}
}

footer{background:var(--ink);color:rgba(255,255,255,.45);padding:30px 0;font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer nav a{text-decoration:none;color:inherit}
footer nav a:hover{color:#fff}

@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header><div class="wrap hd">
  <a href="/" class="logo">GARUDA <span>ACADEMY</span> KOREA</a>
  <nav>
    <a href="/programs/" aria-current="page">교육과정 소개</a>
    <a href="/academy/">개강 일정</a>
    <a href="/studios/">공식 스튜디오</a>

  </nav>
</div></header>

<section class="top">
  <div class="wrap">
    <p class="eyebrow">GARUDA PROGRAMS</p>
    <h1>가루다 교육과정 소개</h1>
    <p>분야를 고른 뒤 과정을 누르면 소개·커리큘럼·핵심가치·영상을 차례로 볼 수 있습니다. 기간과 수강료는 모든 과정에 같은 형식으로 표시됩니다.</p>
    <dl class="stats">
      <div><dt>분야</dt><dd id="st-cat">3</dd></div>
      <div><dt>과정</dt><dd id="st-all">0</dd></div>
      <div><dt>선행 조건</dt><dd>없음</dd></div>
    </dl>
  </div>
</section>

<nav class="picker" aria-label="교육과정 선택">
  <div class="wrap">
    <div class="cats" role="tablist" id="cats"></div>
    <div class="courses" id="courses"></div>
  </div>
</nav>

<main class="detail"><div class="wrap" id="detail" tabindex="-1"></div></main>

<div class="dock">
  <a href="#" class="btn btn-p js-kakao"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7l-1 3.7c-.1.4.3.7.6.5l4.4-2.9c.5.1.9.1 1.4.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>카톡 상담</a>
  <a href="/academy/" class="btn btn-d">개강 일정</a>
</div>

<footer><div class="wrap">
  <nav>
    <a href="/">홈</a>
    <a href="/programs/">교육과정 소개</a>
    <a href="/pilates/">필라테스 스튜디오</a>
    <a href="/barre/">바레 스튜디오</a>
    <a href="/academy/">자격과정 일정</a>
    <a href="/studios/">공식 스튜디오</a>
  </nav>

</div></footer>

<script src="/assets/data/courses.js"></script>
<script src="/assets/data/programs.js"></script>
<script>
(function(){
const D=window.GARUDA_PROGRAMS, C=window.GARUDA_COURSES||[];
const P=Object.fromEntries(D.programs.map(p=>[p.id,p]));
const FACT=Object.fromEntries(C.map(c=>[c.id,c]));
const COLOR={Mat:'var(--mat)',Apparatus:'var(--app)',Auxiliary:'var(--aux)'};
const CAT=Object.fromEntries(D.categories.map(c=>[c.key,c]));
const ORDER=D.categories.flatMap(c=>c.courses).filter(id=>P[id]);
const KAKAO=D.kakao||'#';
const ICON_TALK='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7l-1 3.7c-.1.4.3.7.6.5l4.4-2.9c.5.1.9.1 1.4.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const won=n=>n%10000===0?(n/10000).toLocaleString('ko-KR')+'만원':n.toLocaleString('ko-KR')+'원';
const pad=n=>String(n).padStart(2,'0');

document.querySelectorAll('.js-kakao').forEach(a=>{a.href=KAKAO;if(D.kakao){a.target='_blank';a.rel='noopener'}});
document.getElementById('st-cat').textContent=D.categories.length;
document.getElementById('st-all').textContent=ORDER.length;

const $cats=document.getElementById('cats'),$courses=document.getElementById('courses'),$d=document.getElementById('detail');
let curCat=null;

function drawCats(){
  $cats.innerHTML=D.categories.map(c=>`<button class="cat" role="tab" aria-selected="${c.key===curCat}" data-cat="${c.key}" style="--c:${COLOR[c.key]}"><small>${esc(c.key)}</small>${esc(c.kr)} <span class="num">${c.courses.length}</span></button>`).join('');
}
function drawCourses(cur){
  const c=CAT[curCat];
  $courses.style.setProperty('--c',COLOR[curCat]);
  $courses.innerHTML=c.courses.map(id=>{const p=P[id];
    return `<a class="chip${p.ready?'':' wait'}" href="#${id}" aria-current="${id===cur}">${esc(p.name)}${p.ready?'':'<em>준비중</em>'}</a>`}).join('');
  centerChip();
}
// 선택한 과정 칩이 가로 스크롤 줄 가운데에 오도록 (모바일에서 안 보이는 문제 방지)
function centerChip(){
  const on=$courses.querySelector('[aria-current="true"]'); if(!on) return;
  $courses.scrollLeft=on.offsetLeft-$courses.offsetLeft-($courses.clientWidth-on.offsetWidth)/2;
}
if(document.fonts) document.fonts.ready.then(centerChip);

function factsHTML(p){
  const f=FACT[p.ref]; if(!f) return '';
  return `<dl class="facts">
    <div><dt>기간</dt><dd>${f.d}일</dd></div>
    <div><dt>총 교육시간</dt><dd>${f.h}시간</dd></div>
    <div><dt>수강료</dt><dd>${won(f.c)}</dd></div>
    <div class="eq"><dt>필요 장비</dt><dd>${esc(f.eq)}</dd></div>
  </dl>`;
}
function valBody(s){
  const m=s.match(/^([^:：]{2,22})[:：]\s*(.+)$/);
  return m?`<p><b>${esc(m[1])}</b>${esc(m[2])}</p>`:`<p>${esc(s)}</p>`;
}
function askHTML(p){
  return `<div class="ask"><div><h3>${esc(p.name)} 과정이 궁금하신가요?</h3>
    <p>일정·수강 조건·장비 준비까지 카카오톡으로 바로 답해 드립니다.</p></div>
    <div class="cta2"><a href="${esc(KAKAO)}" class="btn btn-p"${D.kakao?' target="_blank" rel="noopener"':''}>${ICON_TALK}카톡 상담하기</a>
    <a href="/academy/" class="btn btn-d">개강 일정 보기</a></div></div>`;
}
function pnHTML(id){
  const ready=ORDER.filter(x=>P[x].ready), i=ready.indexOf(id);
  if(i<0) return '';
  const a=ready[i-1],b=ready[i+1];
  return `<nav class="pn" aria-label="다른 과정">${a?`<a href="#${a}"><small>이전 과정</small>${esc(P[a].name)}</a>`:''}${b?`<a class="next" href="#${b}"><small>다음 과정</small>${esc(P[b].name)}</a>`:''}</nav>`;
}

function render(id,{scroll}={}){
  const p=P[id]; curCat=p.cat;
  drawCats(); drawCourses(id);
  $d.style.setProperty('--c',COLOR[p.cat]);
  const f=FACT[p.ref];
  let h=`<div class="dhead"><div><p class="eyebrow">${esc(p.cat)} · ${esc(CAT[p.cat].kr)}</p>
    <h2>${esc(p.name)}</h2><p class="kr">${esc(p.kr)}</p></div>${factsHTML(p)}</div>`;

  if(!p.ready){
    h+=`<div class="wait-box"><h3>과정 소개를 준비하고 있습니다</h3>
      <p>커리큘럼과 영상은 곧 공개됩니다. ${f?'기간과 수강료는 위와 같으며, ':'기간과 수강료는 확정되는 대로 표시합니다. '}자세한 내용은 카카오톡으로 먼저 안내해 드립니다.</p>
      <div class="cta2"><a href="${esc(KAKAO)}" class="btn btn-p">${ICON_TALK}카톡 상담하기</a><a href="/academy/" class="btn btn-d">개강 일정 보기</a></div></div>`;
    $d.innerHTML=h; afterRender(scroll); return;
  }

  const parts=[];
  if(p.video) parts.push(['v','영상']);
  parts.push(['i','과정 소개'],['c','커리큘럼'],['k','교육의 핵심가치']);
  if(p.photos&&p.photos.length) parts.push(['g','교육 현장']);
  h+=`<nav class="jump" aria-label="이 과정 안에서 이동">${parts.map(([k,t])=>`<a href="#${id}/${k}" data-jump="${k}">${t}</a>`).join('')}${f?`<a class="sched" href="/academy/">개강 일정 확인 →</a>`:''}</nav>`;

  let n=0; const B=(k,t,body)=>`<section class="block" id="b-${k}"><div class="bh"><span class="n">${pad(++n)}</span><h3>${t}</h3></div>${body}</section>`;
  if(p.video) h+=B('v','영상',`<div class="video"><button type="button" data-yt="${esc(p.video)}" aria-label="${esc(p.name)} 영상 재생">
      <img src="https://i.ytimg.com/vi/${esc(p.video)}/hqdefault.jpg" alt="" loading="lazy">
      <span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button></div>`);
  h+=B('i','과정 소개',`<div class="intro">${p.lead?`<p class="lead">${esc(p.lead)}</p>`:''}${p.intro.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`);
  const descMode=p.curr.every(g=>g.i.length<=1)&&p.curr.some(g=>g.i.length===1);
  h+=B('c','커리큘럼',`${p.notes.length?`<div class="notes">${p.notes.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    <div class="curr${descMode?' desc':''}">${p.curr.map((g,i)=>`<article><span class="gn">${pad(i+1)}</span><h4>${esc(g.t)}</h4>${g.i.length?`<ul>${g.i.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</article>`).join('')}</div>`);
  h+=B('k','교육의 핵심가치',`<div class="vals">${p.values.map(v=>`<article class="val"><p class="role">${esc(v.role)}</p>${v.quote?`<p class="q">“${esc(v.quote)}”</p>`:''}<div class="b">${v.body.map(valBody).join('')}</div></article>`).join('')}</div>
    ${p.closing?`<p class="closing">${esc(p.closing)}</p>`:''}`);
  if(p.photos&&p.photos.length) h+=B('g','교육 현장',`<div class="gal"><div class="slides" tabindex="0" aria-label="교육 현장 사진">${p.photos.map((s,i)=>`<figure><img src="${esc(s)}" alt="${esc(p.name)} 교육 현장 ${i+1}" loading="lazy"></figure>`).join('')}</div>
    <div class="galnav"><button type="button" data-g="-1" aria-label="이전 사진"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><button type="button" data-g="1" aria-label="다음 사진"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><span class="cnt num">1 / ${p.photos.length}</span></div></div>`);
  h+=askHTML(p)+pnHTML(id);
  $d.innerHTML=h; afterRender(scroll);
}

function afterRender(scroll){
  const s=$d.querySelector('.slides');
  if(s){
    const cnt=$d.querySelector('.cnt'),btns=$d.querySelectorAll('[data-g]'),total=s.children.length;
    const idx=()=>Math.round(s.scrollLeft/(s.children[0].offsetWidth+10));
    const upd=()=>{const i=Math.min(idx(),total-1);cnt.textContent=`${i+1} / ${total}`;btns[0].disabled=s.scrollLeft<4;btns[1].disabled=s.scrollLeft+s.clientWidth>=s.scrollWidth-4};
    s.addEventListener('scroll',upd,{passive:true});upd();
    btns.forEach(b=>b.onclick=()=>s.scrollBy({left:(+b.dataset.g)*(s.children[0].offsetWidth+10),behavior:'smooth'}));
  }
  if(scroll){
    const y=document.querySelector('.picker').getBoundingClientRect().height+60;
    window.scrollTo({top:$d.getBoundingClientRect().top+scrollY-y-8,behavior:'smooth'});
    $d.focus({preventScroll:true});
  }
}

// 영상: 버튼을 눌렀을 때 iframe으로 교체
$d.addEventListener('click',e=>{
  const v=e.target.closest('[data-yt]');
  if(v){const id=v.dataset.yt;v.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="과정 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;return}
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();document.getElementById('b-'+j.dataset.jump).scrollIntoView({behavior:'smooth'})}
});
// 분야 탭: 그 분야의 첫 과정(소개가 있는 과정 우선)으로 이동
$cats.addEventListener('click',e=>{
  const b=e.target.closest('[data-cat]'); if(!b) return;
  const list=CAT[b.dataset.cat].courses;
  location.hash=list.find(id=>P[id]&&P[id].ready)||list[0];
});

function fromHash(scroll){
  const id=decodeURIComponent(location.hash.slice(1)).split('/')[0];
  render(P[id]?id:ORDER.find(x=>P[x].ready)||ORDER[0],{scroll:scroll&&!!P[id]});
}
window.addEventListener('hashchange',()=>fromHash(true));
fromHash(!!location.hash);
})();
</script>
</body>
</html>
